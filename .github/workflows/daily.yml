name: PRIME LAB daily 10 checks
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: "Prime world upper bound (2-200000)"
        required: false
        default: "10000"
      sample:
        description: "Number of indexed primes (2-100)"
        required: false
        default: "24"
permissions:
  contents: write
concurrency:
  group: prime-lab-daily
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Explore integer and prime worlds
        env:
          WORLD_LIMIT: ${{ inputs.limit || '10000' }}
          WORLD_SAMPLE: ${{ inputs.sample || '24' }}
        run: python -m src.prime_lab.worlds
      - name: Analyze logarithmic prime patterns
        env:
          WORLD_LIMIT: ${{ inputs.limit || '10000' }}
        run: python -m src.prime_lab.log_analysis
      - name: Generate and verify AI conjectures
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: python -m src.prime_lab.ai_daily
      - name: Search related literature (best effort)
        continue-on-error: true
        run: python -m src.prime_lab.literature
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runs/ data/research.json data/literature/ data/worlds/ data/log_analysis/
          if ! git diff --cached --quiet; then
            git commit -m "Archive daily AI research hypotheses"
            git pull --rebase
            git push
          fi
