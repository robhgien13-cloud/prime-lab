name: PRIME LAB trial run
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run trial pipeline
        run: python -m src.prime_lab.pipeline
      - name: Publish trial data to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runs/ data/research.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish PRIME LAB trial research records"
            git push
          fi
      - name: Upload trial results
        uses: actions/upload-artifact@v4
        with:
          name: prime-lab-trial
          path: |
            data/runs/
            data/research.json
          retention-days: 30
